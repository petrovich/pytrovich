name: CI

on:
  push:
    branches:
    - master
    - development
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # Runs in parallel with tests — ruff is independent of the Python
    # matrix (it's a Rust binary), so one invocation is enough.
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install ruff
      run: pip install ruff

    - name: Lint
      # Configuration lives in ruff.toml at the repo root.
      run: ruff check .

    - name: Check formatting
      # --check exits non-zero if any file would be reformatted, without
      # modifying anything. Run `ruff format .` locally to fix.
      run: ruff format --check .


  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version:
        - '3.9'
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dev dependencies
      run: pip install -r requirements-dev.txt

    - name: Run tests with coverage
      # scripts/coverage.sh runs pytest with --cov, generates html/xml/term
      # reports, and exits non-zero if coverage falls below COVERAGE_MIN
      # (default 80%; see .coveragerc and the script for details).
      run: bash scripts/coverage.sh

    - name: Upload coverage XML
      # Upload from a single matrix cell to avoid 6× duplicate artifacts;
      # the XML is identical across Python versions.
      if: matrix.python-version == '3.12'
      uses: actions/upload-artifact@v5
      with:
        name: coverage-xml
        path: coverage.xml
        if-no-files-found: warn

  benchmarks:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    # Only run benchmarks once the test matrix is green: there's no point
    # measuring throughput of broken code.
    needs: tests

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dev dependencies
      run: pip install -r requirements-dev.txt

    - name: Run benchmarks
      # scripts/benchmark.sh runs `pytest -m benchmark`. The --benchmark-json
      # flag is forwarded to pytest-benchmark and captures full timing
      # statistics + machine info into benchmark.json for archival.
      #
      # We deliberately do NOT enforce a regression threshold here: GitHub
      # Actions runners have variable performance and a strict gate would
      # produce flaky failures. Compare runs by downloading the JSON
      # artifacts from two builds and using `pytest-benchmark compare`.
      run: bash scripts/benchmark.sh --benchmark-json=benchmark.json

    - name: Trim per-sample data from benchmark JSON
      # pytest-benchmark records every individual sample (often >100k per
      # test). Drop them before upload — summary stats are preserved and
      # the file shrinks by ~99.9%.
      run: python scripts/trim_benchmark_json.py benchmark.json

    - name: Upload benchmark results
      uses: actions/upload-artifact@v5
      with:
        name: benchmark-results
        path: benchmark.json
        if-no-files-found: error


  evaluate:
    name: Accuracy evaluation
    runs-on: ubuntu-latest
    # Mirrors petrovich-ruby's `rake evaluate`: run the inflector and
    # gender detector against the petrovich-eval dataset (~250k rows
    # combined) and surface per-bucket accuracy. Runs on every push
    # to keep accuracy numbers visible in CI; the regression gate
    # against eval/baseline.json fails the job on any > 0.9 pp drop
    # in any (gender, case) bucket.
    needs: tests

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install package
      run: pip install -e .

    - name: Evaluate inflection (rules)
      run: |
        python scripts/evaluate.py rules \
          --regression-against eval-baseline.rules.json \
          --tolerance 0.9 \
          --errors errors.rules.tsv

    - name: Evaluate gender detection
      run: |
        python scripts/evaluate.py gender \
          --regression-against eval-baseline.gender.json \
          --tolerance 0.9 \
          --errors errors.gender.tsv

    - name: Upload error TSVs
      # Useful for inspecting which lemmas degraded vs the baseline
      # when the regression gate fires.
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: evaluation-errors
        path: |
          errors.rules.tsv
          errors.gender.tsv
        if-no-files-found: warn
